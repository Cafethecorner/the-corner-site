<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Ancienne URL en .html : redirection permanente vers la nouvelle adresse.
       GitHub Pages ne permet pas les 301 serveur, Google traite ce meta refresh immédiat comme une redirection permanente. -->
  <title>Redirection : The Corner</title>
  <link rel="canonical" href="https://cafethecorner.fr/politique-cookies/">
  <meta http-equiv="refresh" content="0; url=/politique-cookies/">
  <script>location.replace('/politique-cookies/' + location.search + location.hash);</script>
</head>
<body>
  <p>Cette page a déménagé : <a href="/politique-cookies/">cafethecorner.fr/politique-cookies/</a></p>
</body>
</html>
